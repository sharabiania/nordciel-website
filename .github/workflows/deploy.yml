name: Deploy site

# Builds and publishes the site to GitHub Pages on every push to main.
# Cache busting: every "__BUILD__" in the files (e.g. main.js?v=__BUILD__)
# is replaced with the commit id, so after each update browsers see new
# URLs and download the fresh files instead of using a stale cached copy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy site and stamp build version
        run: |
          VERSION="${GITHUB_SHA::8}"
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' ./ _site/
          grep -rlZ "__BUILD__" _site | xargs -0 -r sed -i "s/__BUILD__/${VERSION}/g"
          echo "Stamped version ${VERSION}"
          ! grep -rq "__BUILD__" _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
